name: OpenAPI

# Detección de cambios incompatibles del contrato (OPS-12, plan/03 §2).
# El job `check` de ci.yml ya garantiza que openapi.json coincide con el
# código; aquí se compara con la versión anterior:
# - push a dev/main: contra el commit anterior de la rama → solo avisa;
# - PR a dev: contra dev → solo avisa;
# - PR a main: contra main → falla, salvo etiqueta `breaking-change` o una
#   línea `BREAKING CHANGE:` en la descripción del PR (cambio coordinado con
#   el frontend). Ver README · "OpenAPI como contrato".
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  workflow_dispatch:

concurrency:
  group: openapi-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OASDIFF_IMAGE: tufin/oasdiff:v1.32.1

jobs:
  breaking:
    name: Cambios incompatibles del OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Elegir la versión base
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="origin/$BASE_REF" ;;
            push)
              if [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$'; then
                base="$BEFORE"
              else
                base="HEAD^"
              fi
              ;;
            *) base="origin/main" ;;
          esac
          echo "ref=$base" >> "$GITHUB_OUTPUT"
          if git cat-file -e "$base:openapi.json" 2>/dev/null; then
            git show "$base:openapi.json" > openapi.base.json
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$base no tiene openapi.json: no hay contra qué comparar"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: oasdiff
        if: steps.base.outputs.found == 'true'
        env:
          BASE: ${{ steps.base.outputs.ref }}
          ENFORCE: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change') }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          docker pull -q "$OASDIFF_IMAGE" > /dev/null
          oasdiff() { docker run --rm -v "$PWD:/specs:ro" "$OASDIFF_IMAGE" "$@"; }

          oasdiff changelog /specs/openapi.base.json /specs/openapi.json --format markdown > changelog.md
          set +e
          oasdiff breaking /specs/openapi.base.json /specs/openapi.json --format markdown --fail-on ERR > breaking.md
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then
            echo "::error::oasdiff terminó con código $code"
            cat breaking.md
            exit "$code"
          fi

          {
            echo "## OpenAPI · cambios respecto a \`$BASE\`"
            echo
            echo "### Incompatibles"
            if [ "$code" -eq 1 ]; then cat breaking.md; else echo "Ninguno."; fi
            echo
            echo "### Todos los cambios"
            if [ -s changelog.md ]; then cat changelog.md; else echo "Sin cambios."; fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$code" -eq 0 ]; then
            echo "Sin cambios incompatibles respecto a $BASE."
            exit 0
          fi
          cat breaking.md

          allowed=false
          if [ "$LABELED" = "true" ] || printf '%s' "$PR_BODY" | grep -q 'BREAKING CHANGE:'; then
            allowed=true
          fi
          if [ "$ENFORCE" = "true" ] && [ "$allowed" != "true" ]; then
            echo "::error::El OpenAPI rompe el contrato publicado en main. Coordina el cambio con el frontend y marca el PR con la etiqueta 'breaking-change' (o una línea 'BREAKING CHANGE:' en la descripción)."
            exit 1
          fi
          echo "::warning::El OpenAPI tiene cambios incompatibles respecto a $BASE (detalle en el resumen de la ejecución)."
