name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# En dev no se cancela: la ejecución puede estar desplegando (se encola).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

permissions:
  contents: read

env:
  PRISMA_HIDE_UPDATE_MESSAGE: '1'

jobs:
  check:
    name: Lint, tipos, unitarias y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # OPS-12: openapi.json versionado = el que genera el código compilado
      - name: OpenAPI al día (openapi.json)
        run: |
          node dist/openapi/generate.js
          if ! git diff --exit-code -- openapi.json || [ -n "$(git status --porcelain -- openapi.json)" ]; then
            echo "::error::openapi.json no coincide con el código. Ejecuta 'pnpm openapi:generate' y versiona el resultado."
            exit 1
          fi

  e2e:
    name: e2e y migraciones (Postgres y Redis reales)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: drinks_on_chain_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d drinks_on_chain_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # Correo: el e2e encola un correo y lo lee en la API de Mailpit
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ['1025:1025', '8025:8025']
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 'true'
          MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/drinks_on_chain_ci?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-chars
      CORS_ALLOWED_ORIGINS: http://localhost:3002
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      MAILPIT_API_URL: http://localhost:8025
      # Subidas: el e2e repite el flujo contra MinIO con el driver s3
      S3_E2E: 'true'
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: doc-ci-uploads
      S3_ACCESS_KEY: ci-minio
      S3_SECRET_KEY: ci-only-minio-password
      # Cadena (contrato O3 §14): solo test/chain-o3.e2e-spec.ts usa la red
      # local; el resto de e2e corre con la cadena deshabilitada
      CHAIN_E2E_REQUIRED: 'true'
      CHAIN_E2E_RPC_URL: http://localhost:8000/rpc
      CHAIN_E2E_FRIENDBOT_URL: http://localhost:8000/friendbot
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # MinIO necesita `server <dir>` como argumento: no cabe en `services`
      - name: MinIO (almacenamiento S3 compatible)
        run: |
          docker run -d --name minio -p 9000:9000             -e MINIO_ROOT_USER=ci-minio -e MINIO_ROOT_PASSWORD=ci-only-minio-password             cgr.dev/chainguard/minio:latest@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1             server /tmp/data
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1
      # Red local de Stellar: imagen fijada por digest (canal «testing» = lo
      # que corre testnet) y protocolo pedido a mano (sin la opción arranca en
      # el 28). Efímera: sin Horizon, con RPC y Friendbot. Necesita argumentos:
      # no cabe en `services`
      - name: Red local de Stellar (quickstart, protocolo 29)
        run: |
          docker run -d --name stellar -p 8000:8000 \
            stellar/quickstart:v676-b1505.1-testing@sha256:66a19476f2ce2ed09c4dccf3f1af4d438209eee9ee05eb113a02dd926e2b03f5 \
            --local --enable core,rpc --protocol-version 29
      # Código del contrato NFT: artefacto de la pista SC, por commit y con su
      # SHA-256 comprobado (el `wasm.hash` de deployments/testnet.json)
      - name: Código del contrato NFT (winery_nft.wasm)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/winery_nft.wasm" \
            https://raw.githubusercontent.com/drinks-on-chain/drinks-on-chain-contracts/3eb9ece/artefactos/winery_nft.wasm
          echo "eb9f75b2a17117cab0c44d318ffd2f0f7642c488f56b31167998795ce22089d8  $RUNNER_TEMP/winery_nft.wasm" | sha256sum -c -
          echo "CHAIN_E2E_WASM_PATH=$RUNNER_TEMP/winery_nft.wasm" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - name: Migraciones aplicables desde cero
        run: pnpm exec prisma migrate deploy
      - name: Schema sin cambios pendientes de migración
        # Compara la base recién migrada con schema.prisma; exit 2 = hay diferencias
        run: |
          set +e
          pnpm exec prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --script --exit-code > migrate-diff.sql
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::error::schema.prisma tiene cambios sin migración. Crea una con: pnpm prisma:migrate --name <cambio>"
            cat migrate-diff.sql
            exit 1
          fi
          exit "$code"
      - name: La red local responde (RPC en el protocolo 29 y Friendbot)
        run: |
          rpc() {
            curl -fsS -m 5 -X POST http://localhost:8000/rpc -H 'content-type: application/json' \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$1\"}" 2>/dev/null
          }
          for i in $(seq 1 120); do
            if rpc getHealth | grep -q '"healthy"'; then break; fi
            sleep 1
          done
          rpc getHealth | grep -q '"healthy"' || { docker logs --tail 60 stellar; exit 1; }
          for i in $(seq 1 120); do
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://localhost:8000/friendbot || true)
            # Sin ?addr responde 400 cuando ya atiende; 502 mientras arranca
            if [ "$code" = "400" ] || [ "$code" = "200" ]; then break; fi
            sleep 1
          done
          rpc getNetwork | tee /dev/stderr | grep -q '"protocolVersion":29'
      - run: pnpm test:e2e
      - name: Logs de la red local (si algo falló)
        if: failure()
        run: docker logs --tail 80 stellar || true

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: docker build --pull -t drinks-on-chain-back:ci .
      - name: La imagen arranca como usuario no root
        run: test "$(docker image inspect -f '{{.Config.User}}' drinks-on-chain-back:ci)" = node
      - name: La imagen trae la API, el worker y la semilla
        run: |
          docker run --rm --entrypoint sh drinks-on-chain-back:ci -c \
            'test -f dist/main.js && test -f dist/worker.js && test -f dist/worker-healthcheck.js && test -f dist/seed.js && test -f dist/seed/fixtures/terroirs.json'
          # Sin latido, el healthcheck del worker debe fallar
          ! docker run --rm --entrypoint node drinks-on-chain-back:ci dist/worker-healthcheck.js
      # Claves de la cadena (contrato O3 §2.1): el script del servidor las
      # genera en el .env sin imprimirlas, con copia previa, y es idempotente
      - name: generar-claves-cadena.sh no imprime secretos y es idempotente
        run: |
          home="$(mktemp -d)"
          printf 'STELLAR_NETWORK=TESTNET\nCHAIN_SECRET_ANCHOR=change-me\nOTRA=1' > "$home/.env"
          export DOC_DEV_HOME="$home" CHAIN_KEYS_IMAGE=drinks-on-chain-back:ci
          bash deploy/dev/generar-claves-cadena.sh > "$home/salida-1.txt" 2>&1
          cat "$home/salida-1.txt"
          for name in CHAIN_SECRET_OPERATIONS CHAIN_SECRET_ANCHOR CHAIN_DEV_WINERY_SEED CHAIN_CONSUMER_MASTER_SEED CHAIN_CONSUMER_SEED_CHECK_ADDRESS; do
            test "$(grep -c "^$name=" "$home/.env")" = 1
          done
          grep -q '^OTRA=1$' "$home/.env"
          grep -Eq '^CHAIN_SECRET_OPERATIONS=S[A-Z2-7]{55}$' "$home/.env"
          grep -Eq '^CHAIN_SECRET_ANCHOR=S[A-Z2-7]{55}$' "$home/.env"
          grep -Eq '^CHAIN_DEV_WINERY_SEED=[0-9a-f]{64}$' "$home/.env"
          test "$(stat -c %a "$home/.env")" = 600
          test "$(ls "$home"/.env.bak-* | wc -l)" = 1
          # Ningún secreto en la salida: solo direcciones públicas
          for name in CHAIN_SECRET_OPERATIONS CHAIN_SECRET_ANCHOR CHAIN_DEV_WINERY_SEED CHAIN_CONSUMER_MASTER_SEED; do
            ! grep -qF "$(grep "^$name=" "$home/.env" | cut -d= -f2-)" "$home/salida-1.txt"
          done
          test "$(grep -Ec ' G[A-Z2-7]{55}$' "$home/salida-1.txt")" = 4
          # Repetirlo no cambia nada ni hace otra copia
          before="$(sha256sum < "$home/.env")"
          bash deploy/dev/generar-claves-cadena.sh > "$home/salida-2.txt" 2>&1
          test "$before" = "$(sha256sum < "$home/.env")"
          test "$(ls "$home"/.env.bak-* | wc -l)" = 1
          diff <(grep ' G' "$home/salida-1.txt") <(grep ' G' "$home/salida-2.txt")
          # Nunca en la red pública
          sed -i 's/^STELLAR_NETWORK=.*/STELLAR_NETWORK=PUBLIC/' "$home/.env"
          ! bash deploy/dev/generar-claves-cadena.sh
          rm -rf "$home"

  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # pnpm exacto de package.json#packageManager (el de pnpm/action-setup
      # puede quedar en otra versión mayor y cambiar el código de salida)
      - name: pnpm por corepack
        run: |
          corepack enable
          pnpm --version
      # Bloquea avisos altos o críticos de producción. Las excepciones sin
      # arreglo están en package.json#pnpm.auditConfig.ignoreGhsas y en el README.
      - run: pnpm audit --prod --audit-level high

  deploy-dev:
    name: Desplegar en desarrollo
    needs: [check, e2e, docker, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/deploy-dev.yml
    secrets: inherit
